name: Build Intel Mac Desktop App

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/halloween-intel-mac, feature/intel-mac-desktop]
    tags: ['mac-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install runtime and packager
        run: python -m pip install --prefer-binary -r requirements.txt 'pyinstaller>=6,<7' pytest pytest-asyncio pytest-mock pytest-cov pytest-timeout
      - name: Test configuration, plugins and desktop packaging
        run: python -m pytest tests/test_config_validation.py tests/test_plugin_loader.py tests/test_macos_packaging.py --no-cov
      - name: Build and verify Intel macOS application
        run: bash macos/build-app.sh
      - name: Upload downloadable app and DMG
        uses: actions/upload-artifact@v4
        with:
          name: MeshCore-Bot-Intel-Mac
          path: |
            output/MeshCore-Bot-Intel-Mac.dmg
            output/MeshCore-Bot-Intel-Mac.zip
            output/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mac-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeshCore-Bot-Intel-Mac
          path: output
      - name: Attach packages to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" output/MeshCore-Bot-Intel-Mac.dmg output/MeshCore-Bot-Intel-Mac.zip output/SHA256SUMS.txt --draft --title "MeshCore Bot $GITHUB_REF_NAME (Intel Mac)" --notes 'Intel macOS application. Ad-hoc signed, not notarized. Verify radio and dashboard operation before publishing.'
